name: schwab-trader-brain

# The BRAIN: runs Claude Code headless on a schedule to make the trading decisions
# (read holdings + candidates, research, write orders/watchlist/latest). This path
# uses the Claude Code CLI authenticated by a SUBSCRIPTION OAuth token
# (CLAUDE_CODE_OAUTH_TOKEN) — it does NOT use the capped "scheduled routines" feature,
# so it is not limited to 15/day. The executor (trader.yml) still runs every 15 min to
# place/exit trades from what the brain writes here.
#
# CLEAN ROUTING: this job commits the brain's signal files DIRECTLY to main (see the
# "Commit brain output" step). That makes the hosted "web routine" + the
# brain-signals-to-main.yml bridge REDUNDANT. Once CLAUDE_CODE_OAUTH_TOKEN is set and
# this cron is running, TURN OFF the hosted Claude routine in the web UI so there is
# exactly ONE brain writing to main — no more random claude/* branches, no relay race.

on:
  schedule:
    # 3x/hour (~every 20 min) during US market hours (UTC), at :07/:27/:47 so it never
    # lands on the executor's :00/:15/:30/:45 (BRAIN.md also has a timestamp guard, and
    # the commit step rebase-retries if both push to main at once). Max-5x has plenty of
    # headroom for this; dial up/down by editing this one cron line.
    - cron: '7,27,47 13-20 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: brain
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  brain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gate: until the CLAUDE_CODE_OAUTH_TOKEN secret exists, scheduled runs are a
      # green no-op (no failure spam). Adding the secret auto-activates the brain.
      - name: Check for subscription token
        id: gate
        env:
          TOK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOK" ]; then
            echo "No CLAUDE_CODE_OAUTH_TOKEN yet — skipping brain. Add the secret to enable."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        if: steps.gate.outputs.ready == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the brain
        if: steps.gate.outputs.ready == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "You are the trading BRAIN for this repository. Follow BRAIN.md EXACTLY and obey every guardrail in BRAIN.md and STRATEGY.md. Steps: (1) read the macro tape and candidates from signals/candidates.json and your real positions from signals/holdings.json; (2) run the web research BRAIN.md calls for; (3) WRITE the output files BRAIN.md specifies — signals/orders.json, signals/watchlist.json, signals/latest.md, and signals/positions.md. IMPORTANT: do NOT place any trades and do NOT run git or shell commands — only read the input files, search the web, and write those output files. Respect the orders.json timestamp collision-guard in BRAIN.md." \
            --allowedTools "Read,Edit,Write,WebSearch" \
            --permission-mode acceptEdits \
            --output-format text

      # The workflow (not the model) owns git, so the brain stays sandboxed to file
      # writes + web search. Last-writer-wins on a snapshot race, never fail the run.
      - name: Commit brain output
        if: steps.gate.outputs.ready == 'true'
        run: |
          git config user.name "schwab-brain"
          git config user.email "brain@users.noreply.github.com"
          FILES="signals/orders.json signals/watchlist.json signals/latest.md signals/positions.md reports/today.md"
          git add $FILES 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Brain produced no changes."
            exit 0
          fi
          git commit -m "brain: update picks [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed."; exit 0; fi
            echo "push rejected (main moved); syncing and retrying ($i)..."
            git fetch origin main
            git reset --soft origin/main
            git add $FILES 2>/dev/null || true
            git diff --cached --quiet && { echo "brain output already current."; exit 0; }
            git commit -m "brain: update picks [skip ci]"
            sleep $((i * 3))
          done
          echo "Could not push brain output after retries — non-fatal (next run refreshes)."
          exit 0
