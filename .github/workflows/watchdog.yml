name: watchdog

# Backstop alarm: after the close on weekdays, verify the executor actually completed
# its trading-window run today. Runs on GitHub's scheduler independently of the trader
# job, so a trigger failure over there cannot also silence the alarm.
on:
  schedule:
    - cron: '30 21 * * 1-5'   # 17:30 EDT / 16:30 EST -- after the close in both regimes
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check heartbeat
        id: check
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python watchdog.py

      - name: Open/refresh stall alert
        if: steps.check.outputs.stalled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DETAIL: ${{ steps.check.outputs.detail }}
        run: |
          NUM=$(gh issue list --state open --search "Executor stalled in:title" --json number --jq '.[0].number // empty')
          BODY=$(printf '%b' "🔴 The executor (bot.py) did not complete a trading-window run today.\n\n${DETAIL}\n\nCheck the *trader* workflow's latest runs (Actions tab).\n\n_auto-generated by watchdog_")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$(printf '%b' "Still stalled as of $(date -u +%Y-%m-%d\ %H:%MZ).\n\n${DETAIL}")"
          else
            gh issue create --title "⚠️ Executor stalled — bot.py did not run today" --body "$BODY"
          fi

      - name: Note a run that did not trade
        if: steps.check.outputs.warn == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DETAIL: ${{ steps.check.outputs.detail }}
        run: |
          NUM=$(gh issue list --state open --search "Trading log in:title" --json number --jq '.[0].number // empty')
          [ -n "$NUM" ] && gh issue comment "$NUM" --body "$(printf '%b' "⚠️ watchdog: ${DETAIL}")" || true

      - name: Close stall alert if recovered
        if: steps.check.outputs.stalled == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --search "Executor stalled in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "✅ Executor heartbeat is back ($(date -u +%Y-%m-%d\ %H:%MZ)) — closing."
            gh issue close "$NUM"
          fi
