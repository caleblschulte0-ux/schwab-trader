name: executor-watchdog

# Backstop alarm for the trader (bot.py). On 2026-06-05 the EXTERNAL cron
# (cron-job.org) that triggers schwab-trader-bot silently stopped and the executor
# was dead for ~4.5h of the session — stops gapped through, nobody was told.
#
# CRUCIAL: this watchdog runs on GitHub's OWN `schedule:` cron, NOT cron-job.org.
# That independence is the whole point — the alarm must not share a trigger with
# the thing it's watching. GitHub's scheduler can be delayed a few minutes under
# load, which is fine for a backstop (we only need to catch a stall within ~30 min,
# not to the second). It does NOT replace the external cron that drives trading.

on:
  schedule:
    # Every 15 min, 13:00-21:59 UTC, Mon-Fri — a superset of both EDT (13:30-20:00)
    # and EST (14:30-21:00) sessions. watchdog.py does the precise, DST-aware gating.
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch: {}   # manual test button

permissions:
  contents: read
  issues: write           # to open/close the stall alert issue

concurrency:
  group: executor-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check executor heartbeat
        id: check
        run: python watchdog.py

      # STALL: open a fresh alert issue, or comment on the existing open one
      # (deduped by title so a multi-hour outage produces ONE issue, not dozens).
      - name: Open/refresh stall alert
        if: steps.check.outputs.stalled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DETAIL: ${{ steps.check.outputs.detail }}
        run: |
          NUM=$(gh issue list --state open --search "Executor stalled in:title" \
                  --json number --jq '.[0].number // empty')
          NOWZ=$(date -u +%H:%MZ)
          BODY=$(printf '%b' "🔴 The executor (\`bot.py\`) has not run recently during market hours.\n\n${DETAIL}\n\nLikely cause: the cron-job.org trigger for **schwab-trader-bot** stopped, OR bot.py is erroring every run (e.g. expired \`SCHWAB_REFRESH_TOKEN\`). Check the schwab-trader-bot workflow's recent runs.\n\n_auto-generated by executor-watchdog_")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$(printf '%b' "Still stalled as of ${NOWZ}.\n\n${DETAIL}")"
            echo "Refreshed existing stall issue #$NUM."
          else
            gh issue create --title "⚠️ Executor stalled — bot.py not running" --body "$BODY"
            echo "Opened new stall issue."
          fi

      # HEALTHY during market hours: if a stall issue is open, the executor has
      # recovered — note it and close the issue so the thread reflects live state.
      - name: Resolve stall alert if recovered
        if: steps.check.outputs.stalled == 'false' && steps.check.outputs.market_open == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --search "Executor stalled in:title" \
                  --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "✅ Executor heartbeat resumed at $(date -u +%H:%MZ) — closing."
            gh issue close "$NUM"
            echo "Closed recovered stall issue #$NUM."
          else
            echo "Healthy; no open stall issue."
          fi
