name: schwab-trader-bot

on:
  workflow_dispatch: {}          # manual run button in the Actions tab
  schedule:
    # Every 15 min during ~U.S. market hours (UTC). 13:00-21:00 UTC = ~8a-4p CDT.
    - cron: "*/15 13-21 * * 1-5"

concurrency:
  group: schwab-trader-bot
  cancel-in-progress: false

permissions:
  contents: write   # allow committing the holdings file back to the repo

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install schwab-trader websockets

      - name: Run the bot
        env:
          SCHWAB_APP_KEY: ${{ secrets.SCHWAB_APP_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_REFRESH_TOKEN: ${{ secrets.SCHWAB_REFRESH_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
        run: python bot.py

      - name: Commit holdings snapshot
        if: always()   # still record holdings even if the bot step erred
        run: |
          git config user.name "schwab-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain signals/holdings.json)" ]; then
            git add signals/holdings.json
            git commit -m "bot: update holdings snapshot [skip ci]"
            git push
          else
            echo "No holdings change to commit."
          fi
