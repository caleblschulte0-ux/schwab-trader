name: trader

# The executor (bot.py): ONE strategy step per trading day, in the last two hours of
# the session. Paper by default (DRY_RUN=true -> Alpaca paper account). Flip the
# DRY_RUN repo VARIABLE to false to trade the live account (see SETUP.md).
#
# Triggers:
#   * GitHub's built-in schedule below is the primary trigger. For a once-a-day
#     rebalance, GitHub's few-minutes jitter is irrelevant. Two firings cover EDT and
#     EST; the bot itself refuses to trade outside its window, so the "wrong" one is
#     a harmless no-op, and a second run on the same day only reconciles (idempotent).
#   * workflow_dispatch: the Actions "Run workflow" button, or an external cron
#     (cron-job.org) if you prefer -- point it at 15:30-15:45 ET on weekdays.
on:
  schedule:
    - cron: '35 19 * * 1-5'   # 15:35 ET during daylight time (EDT = UTC-4)
    - cron: '35 20 * * 1-5'   # 15:35 ET during standard time (EST = UTC-5)
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Ignore the market-hours / trade-window guard (orders queue for the open if closed)'
        type: boolean
        default: false
      no_trade:
        description: 'Compute targets and report only; submit no orders'
        type: boolean
        default: false

concurrency:
  group: trader
  cancel-in-progress: false

permissions:
  contents: write   # commit state/holdings/report snapshots back to the repo

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No pip install: everything is stdlib on purpose (nothing to break in CI).

      - name: Run the executor
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          MAX_CAPITAL: ${{ vars.MAX_CAPITAL }}
          MAX_DRAWDOWN_HALT: ${{ vars.MAX_DRAWDOWN_HALT }}
          TRADE_WINDOW_MIN: ${{ vars.TRADE_WINDOW_MIN }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
          NO_TRADE: ${{ github.event.inputs.no_trade || 'false' }}
        run: python bot.py

      - name: Refresh track record
        if: always()
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
        run: python analyze.py || true

      - name: Commit snapshots
        if: always()
        run: |
          git config user.name "trader-bot"
          git config user.email "bot@users.noreply.github.com"
          FILES="signals/state.json signals/targets.json signals/holdings.json signals/performance.json reports/today.md reports/track_record.md reports/paper_ledger.md"
          git add $FILES 2>/dev/null || true
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "bot: daily snapshot [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed."; exit 0; fi
            echo "push rejected (main moved); rebasing snapshot and retrying ($i)..."
            git fetch origin main
            git reset --mixed origin/main
            git add $FILES 2>/dev/null || true
            git diff --cached --quiet && { echo "snapshot already current."; exit 0; }
            git commit -m "bot: daily snapshot [skip ci]"
            sleep $((i * 3))
          done
          echo "Could not push snapshots after retries -- non-fatal (next run refreshes)."
          exit 0
