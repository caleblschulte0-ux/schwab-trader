name: trader

# The executor (bot.py): ONE strategy step per trading day, any time from 30 min after the
# open to the close. Paper by default (DRY_RUN=true). With no Alpaca keys it trades the
# built-in simulator. Flip the DRY_RUN repo VARIABLE to false for live (see SETUP.md; the
# bot also enforces its own live gate).
#
# Triggers: GitHub's schedule (below, every 30 min because it runs late on this repo), the
# Actions "Run workflow" button, or an external cron (cron-job.org) if you want exact timing.
on:
  schedule:
    # GitHub runs this repo's schedules up to ~3 hours late (observed 2026-06 and 2026-09).
    # So fire every 30 minutes through the session: the first run that lands inside the
    # trade window (30 min after the open -> close) trades; later ones only reconcile, and
    # the executor is idempotent per day. Off-hours firings are harmless no-ops.
    - cron: '15,45 13-20 * * 1-5'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Ignore the market-hours / trade-window guard (orders queue for the open if closed)'
        type: boolean
        default: false
      no_trade:
        description: 'Compute targets and report only; submit no orders'
        type: boolean
        default: false

concurrency:
  group: trader
  cancel-in-progress: false

permissions:
  contents: write   # commit state/holdings/report snapshots back to the repo
  issues: write     # append each day's run log to the "Trading log" issue

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No pip install: everything is stdlib on purpose (nothing to break in CI).

      - name: Preflight
        run: python doctor.py || true

      # Defensive-only news layer. Any failure here is ignored: the executor then trades on the
      # strategy alone. Needs ANTHROPIC_API_KEY (API) or CLAUDE_CODE_OAUTH_TOKEN (subscription).
      - name: News risk scan
        continue-on-error: true
        timeout-minutes: 6
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 || true; fi
          python news_brain.py

      - name: Run the executor
        id: run
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          MAX_CAPITAL: ${{ vars.MAX_CAPITAL }}
          MAX_DRAWDOWN_HALT: ${{ vars.MAX_DRAWDOWN_HALT }}
          TRADE_WINDOW_MIN: ${{ vars.TRADE_WINDOW_MIN }}
          LIVE_CONFIRM: ${{ vars.LIVE_CONFIRM }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
          NO_TRADE: ${{ github.event.inputs.no_trade || 'false' }}
        run: python bot.py

      - name: Refresh track record
        if: always()
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
        run: python analyze.py || true

      # A crash (non-zero exit) opens or refreshes ONE alert issue with the traceback, so a
      # broken run is impossible to miss. The watchdog separately catches a run that never happened.
      - name: Alert on executor error
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --search "Executor error in:title" --json number --jq '.[0].number // empty')
          { echo "🔴 The executor exited with an error on $(date -u +%Y-%m-%d\ %H:%MZ). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo; echo '```'; tail -c 4000 reports/today.md 2>/dev/null || echo "(no report written)"; echo '```'; } > /tmp/err.md
          if [ -n "$NUM" ]; then gh issue comment "$NUM" --body-file /tmp/err.md; else gh issue create --title "🔴 Executor error — bot.py failed" --body-file /tmp/err.md; fi

      - name: Close error alert if healthy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --search "Executor error in:title" --json number --jq '.[0].number // empty')
          [ -n "$NUM" ] && gh issue close "$NUM" --comment "✅ Executor ran cleanly on $(date -u +%Y-%m-%d) — closing." || true

      # One rolling issue holds the daily log, so the whole history is readable in one thread
      # and you get a GitHub notification per run if you subscribe to it.
      - name: Append run log to the Trading log issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f reports/today.md ] || exit 0
          # Only post runs that did something worth reading (orders, news overrides, halts, data problems).
          grep -qE "order\(s\):|NEWS OVERRIDE|KILL SWITCH|HALTED|STALE DATA|REFUSED|FAILED|scorecard: override" reports/today.md || { echo "quiet run; not posting"; exit 0; }
          NUM=$(gh issue list --state open --search "Trading log in:title" --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            NUM=$(gh issue create --title "📈 Trading log" --body "One comment per executor run. Latest state: see index.html / reports/today.md." | grep -o '[0-9]*$')
          fi
          head -c 6000 reports/today.md > /tmp/body.md
          gh issue comment "$NUM" --body-file /tmp/body.md || echo "could not comment (non-fatal)"

      - name: Commit snapshots
        if: always()
        run: |
          git config user.name "trader-bot"
          git config user.email "bot@users.noreply.github.com"
          FILES="signals/state.json signals/targets.json signals/holdings.json signals/performance.json signals/sim_account.json signals/news_risk.json signals/news_log.json signals/executions.json reports/today.md reports/track_record.md reports/paper_ledger.md"
          for f in $FILES; do [ -e "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "bot: daily snapshot [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed."; exit 0; fi
            echo "push rejected (main moved); rebasing snapshot and retrying ($i)..."
            git fetch origin main
            git reset --mixed origin/main
            for f in $FILES; do [ -e "$f" ] && git add "$f"; done
            git diff --cached --quiet && { echo "snapshot already current."; exit 0; }
            git commit -m "bot: daily snapshot [skip ci]"
            sleep $((i * 3))
          done
          echo "Could not push snapshots after retries -- non-fatal (next run refreshes)."
          exit 0
