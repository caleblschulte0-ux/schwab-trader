name: schwab-trader-bot

# ⏸️ SCHEDULE PAUSED (2026-06-01): the $200 ACH deposit is still PENDING (dated
# 06/02) and not cleared for trading, so orders can't fill yet. Auto-runs are
# disabled to avoid spamming canceled orders. To RESUME once funds clear:
# uncomment the `schedule:` block below. The manual "Run workflow" button still
# works anytime.
on:
  workflow_dispatch: {}          # manual run button (always available)
  # schedule:
  #   - cron: "*/15 13-21 * * 1-5"   # every 15 min, ~8a-4p CDT, Mon-Fri

concurrency:
  group: schwab-trader-bot
  cancel-in-progress: false

permissions:
  contents: write   # allow committing the holdings file back to the repo

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install schwab-trader websockets

      - name: Run the bot
        env:
          SCHWAB_APP_KEY: ${{ secrets.SCHWAB_APP_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_REFRESH_TOKEN: ${{ secrets.SCHWAB_REFRESH_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
        run: python bot.py

      - name: Commit holdings snapshot
        if: always()
        run: |
          git config user.name "schwab-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain signals/holdings.json)" ]; then
            git add signals/holdings.json
            git commit -m "bot: update holdings snapshot [skip ci]"
            git push
          else
            echo "No holdings change to commit."
          fi
