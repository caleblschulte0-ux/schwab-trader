name: schwab-trader-bot

# Running in PAPER mode (DRY_RUN=true) while the ACH deposit clears — the bot
# logs what it WOULD trade but places nothing real. Flip DRY_RUN to false (and
# confirm funds cleared) to go live.
on:
  # Triggered EXTERNALLY via the GitHub API (workflow_dispatch) from a cloud cron
  # service (e.g. cron-job.org) every 15 min, Mon-Fri, 13:00-21:00 UTC. GitHub's
  # built-in `schedule:` cron is intentionally NOT used (unreliable timing for a
  # trading loop). The Actions-tab "Run workflow" button also works.
  workflow_dispatch: {}          # manual + external-cron trigger

concurrency:
  group: schwab-trader-bot
  cancel-in-progress: false

permissions:
  contents: write   # allow committing holdings + paper-book snapshots back to the repo

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install schwab-trader websockets

      - name: Run the bot
        env:
          SCHWAB_APP_KEY: ${{ secrets.SCHWAB_APP_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_REFRESH_TOKEN: ${{ secrets.SCHWAB_REFRESH_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
        run: python bot.py

      - name: Commit data snapshots
        if: always()
        run: |
          git config user.name "schwab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add signals/holdings.json signals/paper_account.json reports/paper_ledger.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "bot: update holdings + paper-book snapshot [skip ci]"
          # Other pushers (the offset brain routines + concurrent runs) move main
          # under us, so a plain push gets rejected. Rebase our snapshot onto the
          # latest main and retry. These are regenerated each run, so "last writer
          # wins" is fine; never fail the trading run over a snapshot-persist race.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed."
              exit 0
            fi
            echo "push rejected (main moved); syncing to latest and retrying ($i)..."
            git fetch origin main
            git reset --soft origin/main
            git add signals/holdings.json signals/paper_account.json reports/paper_ledger.md 2>/dev/null || true
            git diff --cached --quiet && { echo "snapshot already current."; exit 0; }
            git commit -m "bot: update holdings + paper-book snapshot [skip ci]"
            sleep $((i * 3))
          done
          echo "Could not push data snapshots after retries — non-fatal (next run will refresh)."
          exit 0
