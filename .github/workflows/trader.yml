name: schwab-trader-bot

# Runs the bot on a schedule (free) AND via a manual "Run workflow" button.
# NOTE: scheduled runs only fire when this file is on the repo's DEFAULT branch.
on:
  workflow_dispatch: {}          # manual run button in the Actions tab
  schedule:
    # Every 15 min during ~U.S. market hours (UTC). 13:00-21:00 UTC = ~8a-4p CDT.
    # (Was 5 min — slowed to reduce repeated place/cancel churn on a small account.)
    - cron: "*/15 13-21 * * 1-5"

# Don't let two runs overlap and fight over the same orders.
concurrency:
  group: schwab-trader-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install schwab-trader websockets

      - name: Run the bot
        env:
          SCHWAB_APP_KEY: ${{ secrets.SCHWAB_APP_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_REFRESH_TOKEN: ${{ secrets.SCHWAB_REFRESH_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
        run: python bot.py
