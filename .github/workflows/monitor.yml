name: intraday monitor
# Mid-session watch. Never trades. On a big drop: opens an alert issue and forces a fresh
# news scan so the next executor run decides with current information.
on:
  schedule:
    # Hourly at an odd minute. Doubles as a BACKUP TRIGGER for the trader: GitHub drops most
    # scheduled runs on this repo (observed ~2 of 16 trader firings per day), so every
    # monitor run that lands during market hours kicks the trader if today hasn't traded.
    - cron: '23 13-20 * * 1-5'
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
  actions: write   # to dispatch trader.yml as a backup trigger
concurrency:
  group: monitor
  cancel-in-progress: true
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Backup trigger for the trader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOW_ET=$(TZ=America/New_York date +%H%M); DOW=$(TZ=America/New_York date +%u); TODAY=$(TZ=America/New_York date +%Y-%m-%d)
          LAST=$(python -c "import json;print(json.load(open('signals/state.json')).get('last_trade_date',''))" 2>/dev/null || echo "")
          if [ "$DOW" -le 5 ] && [ "$NOW_ET" -ge 1000 ] && [ "$NOW_ET" -lt 1555 ] && [ "$LAST" != "$TODAY" ]; then
            echo "market hours and no trade yet today (last=$LAST): dispatching trader"
            gh workflow run trader.yml --ref main || echo "dispatch failed (non-fatal)"
          else
            echo "no dispatch needed (time=$NOW_ET dow=$DOW last_trade=$LAST)"
          fi

      - name: Check prices
        id: m
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python monitor.py
      - name: Forced news re-scan
        if: steps.m.outputs.alert == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NEWS_FORCE: "1"
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 || true; fi
          python news_brain.py
      - name: Alert issue + commit
        if: steps.m.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DETAIL: ${{ steps.m.outputs.detail }}
        run: |
          SUMMARY=$(python -c "import json;d=json.load(open('signals/news_risk.json'));print(f\"news risk level {d.get('market_risk')}: {d.get('summary','')}\")" 2>/dev/null || echo "no news verdict")
          gh issue create --title "🚨 Big move: ${DETAIL}" --body "$(printf '%b' "Intraday monitor ($(date -u +%H:%MZ)): ${DETAIL}\n\n${SUMMARY}\n\nThe bot does NOT sell mid-crash (historically the market bounces more often than not after big down days). The next executor run will apply the fresh news verdict and the strategy's own trend rules.")" || true
          git config user.name "monitor-bot"; git config user.email "bot@users.noreply.github.com"
          for f in signals/alert.json signals/news_risk.json; do [ -e "$f" ] && git add "$f"; done
          git diff --cached --quiet || { git commit -m "monitor: intraday alert [skip ci]"; git pull --rebase origin main || true; git push || true; }
