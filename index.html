<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Schwab Bot Dashboard</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --txt:#e6edf3;
          --mut:#8b949e; --grn:#3fb950; --red:#f85149; --acc:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         background:var(--bg); color:var(--txt); padding:16px; }
  h1 { font-size:20px; margin:0 0 2px; }
  .sub { color:var(--mut); font-size:13px; margin-bottom:16px; }
  .pill { display:inline-block; font-size:12px; padding:2px 8px; border-radius:10px;
          background:#1f6feb33; color:var(--acc); border:1px solid #1f6feb55; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:14px 16px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 10px; color:var(--mut); text-transform:uppercase;
             letter-spacing:.5px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th,td { text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--mut); font-weight:600; font-size:12px; }
  tr:last-child td { border-bottom:none; }
  .sym { font-weight:700; }
  .buy { color:var(--grn); } .sell { color:var(--red); }
  .pos { color:var(--grn); } .neg { color:var(--red); }
  .mono { font-variant-numeric:tabular-nums; }
  pre { white-space:pre-wrap; font-size:13px; color:var(--txt);
        background:#0d1117; border:1px solid var(--line); border-radius:8px;
        padding:12px; overflow-x:auto; line-height:1.45; }
  .foot { color:var(--mut); font-size:12px; text-align:center; margin-top:18px; }
  button { background:#21262d; color:var(--txt); border:1px solid var(--line);
           border-radius:8px; padding:8px 14px; font-size:14px; }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:14px; }
  a { color:var(--acc); }
</style>
</head>
<body>
  <h1>📈 Schwab Bot Dashboard</h1>
  <div class="sub">AI picks &amp; positions · <span class="pill" id="mode">DRY-RUN · paper</span></div>

  <div class="row">
    <button onclick="loadAll()">↻ Refresh</button>
    <span class="sub" id="updated" style="margin:0;"></span>
  </div>

  <div class="card">
    <h2>Current Orders</h2>
    <div id="orders">Loading…</div>
  </div>

  <div class="card">
    <h2>Open Positions</h2>
    <div id="positions">Loading…</div>
  </div>

  <div class="card">
    <h2>Today's Report</h2>
    <div id="report">Loading…</div>
  </div>

  <div class="card">
    <h2>Latest Reasoning</h2>
    <div id="latest">Loading…</div>
  </div>

  <div class="foot">Auto-generated by the trading routine · refresh to pull the newest run.</div>

<script>
const RAW = "https://raw.githubusercontent.com/caleblschulte0-ux/schwab-trader/main/";
const bust = () => "?t=" + Date.now();

async function getText(path){
  try { const r = await fetch(RAW + path + bust()); if(!r.ok) return null; return await r.text(); }
  catch(e){ return null; }
}

function fmt(n){ return (n>=0?"+":"") + "$" + Number(n).toFixed(2); }

async function loadOrders(){
  const t = await getText("signals/orders.json");
  const el = document.getElementById("orders");
  if(!t){ el.textContent = "No orders file yet."; return; }
  let d; try { d = JSON.parse(t); } catch(e){ el.textContent = "Could not parse orders."; return; }
  document.getElementById("updated").textContent = "Picks generated: " + (d.generated_utc || "?");
  if(!d.orders || !d.orders.length){ el.innerHTML = "<div class='sub'>No active orders — HOLD.</div>"; return; }
  let rows = d.orders.map(o => {
    if(o.action === "SELL")
      return `<tr><td class="sym">${o.symbol}</td><td class="sell">SELL (close)</td><td colspan="3" class="sub">exit signal</td></tr>`;
    const cost = (o.quantity*o.limit_price).toFixed(2);
    return `<tr><td class="sym">${o.symbol}</td><td class="buy">BUY ${o.quantity}</td>
      <td class="mono">$${o.limit_price}</td>
      <td class="mono">🎯 $${o.take_profit ?? "-"}</td>
      <td class="mono">🛑 $${o.stop_loss ?? "-"} · $${cost}</td></tr>`;
  }).join("");
  el.innerHTML = `<table><tr><th>Symbol</th><th>Action</th><th>Limit</th><th>Target</th><th>Stop · Cost</th></tr>${rows}</table>`;
}

async function loadMd(path, id, empty){
  const t = await getText(path);
  const el = document.getElementById(id);
  el.innerHTML = t ? ("<pre>" + t.replace(/</g,"&lt;") + "</pre>") : ("<div class='sub'>" + empty + "</div>");
}

async function loadAll(){
  document.getElementById("updated").textContent = "Refreshing…";
  await Promise.all([
    loadOrders(),
    loadMd("signals/positions.md", "positions", "No positions file yet — will appear after the next run."),
    loadMd("reports/today.md", "report", "No report yet — appears after the market close."),
    loadMd("signals/latest.md", "latest", "No reasoning file yet."),
  ]);
}
loadAll();
</script>
</body>
</html>
